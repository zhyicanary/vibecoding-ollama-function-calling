readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "langchain==0.3.7",
    "langchain-chroma>=0.2.2",
    "langchain-community>=0.3.7",
    "langchain-ollama>=0.3.3",
    "langchain-text-splitters>=0.3",
    "langgraph>=0.2",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "pytz>=2024.1",
    "requests>=2.31",
    "protobuf<=3.20.3",
    "pypdf>=6.12.2",
    "sentence-transformers>=5.5.1",
]
